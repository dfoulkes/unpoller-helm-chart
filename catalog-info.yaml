apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: unpoller
  description: >
    UniFi metrics exporter for Prometheus. Scrapes UniFi Dream Machine for
    network metrics (client roaming, device stats, traffic stats). Exposes
    Prometheus metrics at :9130. Deployed via Helm chart at
    github.com/dfoulkes/unpoller-helm-chart.
  labels:
    service: unpoller
    layer: service
    domain: network
    tier: standard
    trust_zone: none
    environment: prod
    extends: k3s-workload
    namespace: monitoring
  annotations:
    github.com/project-slug: dfoulkes/unpoller-helm-chart
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://github.com/dfoulkes/unpoller-helm-chart/blob/main/docs/index.md
      title: Runbook
      icon: docs
      type: runbook
    - url: https://github.com/dfoulkes/unpoller-helm-chart
      title: Helm Chart
      icon: github
    - url: https://unpoller.com
      title: UnPoller Documentation
      icon: docs
spec:
  type: service
  lifecycle: production
  owner: group:platform-team
  system: network
  dependsOn:
    - component:prometheus
